name: EU opportunity collection

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
      timezone: Europe/Rome

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eu-funding-collection
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test the browser matcher
        run: node tests/test_matcher.js
      - name: Check matching quality against the frozen benchmark
        run: python scripts/evaluate_matcher.py --check
      - name: Download opportunities
        run: python -m bandi_eu sync
      - name: Commit the dataset
        run: |
          if git diff --quiet -- data/opportunities.jsonl && [ -z "$(git ls-files --others --exclude-standard data/opportunities.jsonl)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.jsonl
          git commit -m "Update EU funding opportunities"
          git push
      - name: Build the public portal
        run: python -m bandi_eu build-site --output public_site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the public portal
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_site

  deploy:
    needs: sync
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the public portal
        id: deployment
        uses: actions/deploy-pages@v5
